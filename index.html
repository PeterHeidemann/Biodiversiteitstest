<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#650500">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Biodiversiteitsquiz">
<meta name="description" content="Hoe goed ken jij de natuur op de Oale Esch? 10 vragen van de werkgroep Biodiversiteit.">
<meta property="og:title" content="Biodiversiteitstest Oale Esch">
<meta property="og:description" content="Hoe goed ken jij de natuur op de Oale Esch? 10 vragen over insecten, vogels, bestuivers en bodemleven.">
<meta property="og:image" content="img/cover.jpg">
<link rel="apple-touch-icon" href="img/icon-kever.png">
<link rel="icon" href="img/icon-kever.png">
<title>Biodiversiteitstest Oale Esch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,700;0,800;1,600&display=swap" rel="stylesheet">
<style>
  :root{
    --bordeaux:#650500; --bordeaux-d:#4a0400;
    --zwart:#000; --grijs:#666; --licht:#e7e7e7; --wit:#fff;
    --groen:#95c23d; --groen-bg:#eef6df; --rood:#CE142F; --rood-bg:#fbe5e8;
    --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  }
  [hidden]{display:none!important}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--licht);color:var(--zwart)}
  body{font-family:"Barlow",system-ui,-apple-system,sans-serif;font-size:18px;line-height:1.45;
       -webkit-text-size-adjust:100%;min-height:100svh}
  button{font:inherit;color:inherit}
  .app{max-width:560px;margin:0 auto;min-height:100svh;display:flex;flex-direction:column;background:var(--licht)}

  /* Header: bordeaux vlak met halfronde hoek */
  header{background:var(--bordeaux);color:#fff;padding:calc(var(--safe-t) + 14px) 20px 14px;
         border-bottom-right-radius:48px;position:sticky;top:0;z-index:5}
  .brand{display:flex;align-items:baseline;gap:8px;letter-spacing:.06em;font-size:13px;text-transform:uppercase}
  .brand b{font-weight:800}
  .brand span{font-weight:400;opacity:.85}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-weight:700;font-size:15px}
  .score-pill{background:rgba(255,255,255,.14);padding:4px 12px;font-size:15px}
  .progress{height:6px;background:rgba(255,255,255,.22);margin-top:10px}
  .progress i{display:block;height:100%;width:0;background:#fff;transition:width .35s ease}

  main{flex:1;padding:18px 16px calc(var(--safe-b) + 24px)}
  .card{background:#fff}
  .photo{display:block;width:100%;max-height:44svh;object-fit:cover;background:#ddd}
  .photo.contain{object-fit:contain;background:#fff}
  .qbody{padding:18px 18px 20px}
  .qnum{color:var(--bordeaux);font-weight:800;font-size:14px;letter-spacing:.08em;text-transform:uppercase}
  h2{font-size:22px;line-height:1.3;margin:6px 0 16px;font-weight:700}

  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:56px;
       padding:10px 14px 10px 10px;background:var(--licht);border:2px solid transparent;cursor:pointer;
       font-size:17px;line-height:1.3;transition:transform .08s ease, background .2s, border-color .2s}
  .opt:active{transform:scale(.985)}
  .opt .let{flex:0 0 38px;height:38px;display:grid;place-items:center;background:var(--bordeaux);color:#fff;font-weight:800;font-size:18px}
  .opt[disabled]{cursor:default}
  .opt.goed{background:var(--groen-bg);border-color:var(--groen)}
  .opt.goed .let{background:var(--groen);color:#000}
  .opt.fout{background:var(--rood-bg);border-color:var(--rood)}
  .opt.fout .let{background:var(--rood)}
  .opt.dim{opacity:.5}

  .reveal{margin-top:16px;border-left:6px solid var(--bordeaux);background:#fff;padding:0;overflow:hidden;
          animation:pop .35s ease}
  .verdict{font-weight:800;font-size:20px;padding:14px 16px 4px}
  .verdict.ok{color:#3f6a0a}
  .verdict.nok{color:var(--rood)}
  .answer{padding:0 16px;font-weight:700;color:var(--bordeaux)}
  .uitleg{padding:6px 16px 16px;color:var(--grijs)}
  .reveal img{width:100%;display:block;max-height:46svh;object-fit:cover}
  .reveal img.contain{object-fit:contain;background:#fff}

  .btn{display:block;width:100%;min-height:56px;margin-top:16px;border:0;background:var(--bordeaux);color:#fff;
       font-weight:800;font-size:18px;letter-spacing:.03em;cursor:pointer}
  .btn:active{background:var(--bordeaux-d)}
  .btn.ghost{background:#fff;color:var(--bordeaux);border:2px solid var(--bordeaux)}

  /* Start */
  .hero{position:relative}
  .hero img{width:100%;height:38svh;object-fit:cover;display:block}
  .hero .tag{position:absolute;left:0;bottom:0;background:var(--bordeaux);color:#fff;padding:8px 14px;font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase}
  .intro{padding:20px 18px 22px;background:#fff}
  .intro h1{font-size:32px;line-height:1.1;margin:0 0 8px;font-weight:800;color:var(--bordeaux)}
  .intro p{margin:0 0 6px;color:var(--grijs)}
  .themes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0 4px}
  .theme{text-align:center;font-size:13px;font-weight:700;color:var(--zwart)}
  .theme span{display:grid;place-items:center;aspect-ratio:1;background:var(--licht);margin-bottom:6px}
  .theme img{width:62%;height:auto}

  /* Einde */
  .result{background:#fff;padding:26px 18px 22px;text-align:center}
  .big{font-size:76px;font-weight:800;color:var(--bordeaux);line-height:1}
  .big small{font-size:30px;color:var(--grijs)}
  .rank{font-size:26px;font-weight:800;margin:10px 0 4px}
  .result p{color:var(--grijs);margin:8px 0 0}
  .levels{margin-top:18px;display:flex;flex-direction:column;gap:6px;text-align:left}
  .lvl{display:flex;gap:12px;align-items:center;padding:10px 12px;background:var(--licht);font-size:16px}
  .lvl b{flex:0 0 58px;font-weight:800}
  .lvl.on{background:var(--bordeaux);color:#fff}
  .recap{margin-top:16px;display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
  .recap i{height:10px;background:var(--rood)}
  .recap i.g{background:var(--groen)}

  footer{background:var(--bordeaux);color:#fff;font-size:13px;padding:14px 20px calc(var(--safe-b) + 14px);letter-spacing:.03em}
  footer a{color:#fff}

  @keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .shake{animation:shake .3s ease}
  .confetti{position:fixed;inset:0;pointer-events:none;z-index:20;overflow:hidden}
  .confetti i{position:absolute;top:-20px;width:9px;height:14px;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110svh) rotate(720deg)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><span><span style="font-weight:400">HEREN</span><b>BOEREN</b></span><b>OALE ESCH</b></div>
    <div class="topbar" id="topbar" hidden>
      <span id="qcount">Vraag 1 / 10</span>
      <span class="score-pill" id="scorepill">0 punten</span>
    </div>
    <div class="progress" id="progress" hidden><i id="bar"></i></div>
  </header>
  <main id="main" aria-live="polite"></main>
  <footer>werkgroep Biodiversiteit · Herenboerderij Oale Esch</footer>
</div>

<script>
const Q = [
  { q:"We willen op onze boerderij graag een hoge biodiversiteit: zoveel mogelijk verschillende organismen, zoals insecten, vogels, zoogdieren en bodemdieren. Waarom willen we dat?",
    img:"q1a.jpg", opts:[
      "Omdat we van de Oale Esch een natuurgebied willen maken",
      "Omdat we dan veel meer subsidie krijgen",
      "Omdat natuurlijke vijanden de plaagsoorten in evenwicht houden",
      "Omdat de bodem dan vruchtbaarder wordt",
      "Omdat het wettelijk verplicht is voor biologische landbouwbedrijven"],
    good:[2], uitleg:"Hoe gevarieerder de natuur, hoe robuuster het systeem — en hoe minder last van plagen.", aimg:null },
  { q:"We kregen afgelopen week zoete aardappel mee. Welk organisme veroorzaakte deze gaten?",
    img:"q2.jpg", opts:["Wormen","Emelten","Zandvlooien","Woelmuizen","Houtduiven"],
    good:[3], uitleg:"Het was de woelmuis — hier op heterdaad betrapt!", aimg:"q2a.jpg" },
  { q:"We hadden dit jaar een nest met torenvalken, en die eten veel muizen. Hoeveel muizen hebben ze naar het nest gebracht?",
    img:"q3.jpg", opts:["45","180","450","750","1500"],
    good:[3], uitleg:"We hadden 4 jongen. Elk jong krijgt zo'n 5 muizen per dag en zit 5 à 6 weken in het nest: 4 × 5 × 7 dagen × 5,5 weken ≈ 750 muizen.", aimg:"q3a.jpg" },
  { q:"Wat is er bijzonder aan een koekoeksbij?",
    img:"q4.jpg", opts:[
      "Ze maken het geluid van een koekoek",
      "Ze zitten veel op koekoeksbloemen",
      "Ze hebben dezelfde tekening en kleur als een koekoek",
      "Ze vliegen alleen rond de tijd dat de koekoek in het land is",
      "Ze leggen hun eitjes in het nest van andere bijen"],
    good:[4], uitleg:"Net als de koekoek bij vogels leggen koekoeksbijen hun eitjes in het nest van andere bijen.", aimg:"q4a.jpg", acontain:true },
  { q:"Waarom hebben we geen bijenkasten op de boerderij?",
    img:"q5.jpg", opts:[
      "We hebben genoeg andere bestuivers, zoals wespen, zweefvliegen en hommels",
      "Dat mag niet op een biologische boerderij (SKAL) vanwege een parasiet (varroamijt)",
      "De bomen in de boomgaard zijn nog te klein en bloeien nog niet",
      "De boerderij heeft nog te weinig bloeiende planten in het vroege voorjaar",
      "De imkerregelgeving vereist een te grote afstand tot oogstbare groentebedden"],
    good:[0], uitleg:"We hebben genoeg andere bestuivers: in totaal 136 soorten! Zie ook waarneming.nl.", aimg:"q5a.jpg", acontain:true },
  { q:"We hebben vorige winter veel nestkastjes geplaatst voor onder andere mezen. Deze vogels eten veel rupsen. Toch hadden we best veel rupsen. Hoe kan dat?",
    img:"q6b.jpg", opts:[
      "Er waren te weinig mezen ten opzichte van de rupsen",
      "Door de droogte van dit jaar zijn er veel mezen doodgegaan",
      "Dit soort rupsen had een vreemde smaak en werd niet gegeten",
      "Volwassen mezen eten zelf liever zaden en bessen dan rupsen",
      "Mezen voeren alleen rupsen aan hun jongen tijdens het voorjaar"],
    good:[4], uitleg:"Mezen voeren alleen in het voorjaar rupsen aan hun jongen — maar rupsen komen het hele jaar voor.", aimg:"q6a.jpg" },
  { q:"Wat is de belangrijkste functie van bloemenstroken langs akkers?",
    img:"q7.jpg", opts:[
      "Voedsel en schuilplaats bieden aan bestuivers en natuurlijke vijanden van plagen",
      "Vooral de boerderij er mooier uit laten zien",
      "Onkruid uit de akker weghouden",
      "Extra opbrengst leveren voor de verkoop van bloemen",
      "Wind tegenhouden zodat gewassen niet omwaaien"],
    good:[0], uitleg:"Bloemenstroken leveren nectar en stuifmeel. Daarmee trekken ze bestuivers én natuurlijke vijanden van plagen aan.", aimg:null },
  { q:"Wat doen regenwormen vooral voor de bodem op de boerderij?",
    img:"q8.jpg", opts:[
      "Ze eten de wortels van onkruid op",
      "Ze verwerken plantenresten tot humus en maken gangen waardoor lucht en water de grond in kunnen",
      "Ze maken de grond zuurder zodat gewassen beter groeien",
      "Ze houden mollen weg van de akkers",
      "Ze zetten stikstof uit de lucht vast, net als klaver"],
    good:[1], uitleg:"Regenwormen trekken dode bladeren en plantenresten de grond in en verteren ze tot humusrijke wormenpoep. Hun gangen zorgen voor lucht en afwatering, en wortels groeien er makkelijk doorheen. Veel wormen is een teken van een gezonde, levende bodem.", aimg:null },
  { q:"Wat doet deze ‘wigwam’ op de Oale Esch?",
    img:"q9.jpg", opts:[
      "Een plek om het aantal knaagdieren te monitoren",
      "De muizen worden zo weggelokt van de schuur en de voeropslag, waar ze anders schade aanrichten",
      "Cafetaria voor uilen en roofvogels",
      "Een overwinteringsplek voor mollen",
      "Mystieke plek voor rituelen uit de biologisch-dynamische landbouw"],
    good:[1,2], uitleg:"Een muizenruiter trekt knaagdieren weg bij de boerderij. Het is een schuilplaats voor muizen — en dus ook een makkelijke plek voor uilen en roofvogels om een muis te verschalken.", aimg:null },
  { q:"Vorige week is er een raaf gesignaleerd op de Oale Esch. Wat is bijzonder aan de raaf?",
    img:"q10.jpg", opts:["Zeer intelligent","Werken samen met wolven","Grootste zangvogel ter wereld","Spanwijdte van meer dan 1,20 m","Imiteren mensenstemmen"],
    good:[0,1,2,3,4], uitleg:"Het is allemaal waar! Raven komen sinds 2 jaar weer voor in Twickel.", aimg:null }
];
const L = "ABCDE";
let i = 0, score = 0, results = [];
const $ = s => document.querySelector(s);
const main = $("#main");

function setHeader(show){
  $("#topbar").hidden = !show; $("#progress").hidden = !show;
}
function updateHeader(){
  $("#qcount").textContent = `Vraag ${i+1} / ${Q.length}`;
  $("#scorepill").textContent = `${score} ${score===1?"punt":"punten"}`;
  $("#bar").style.width = (i / Q.length * 100) + "%";
}
function preload(n){ const q=Q[n]; if(!q) return; [q.img,q.aimg].forEach(s=>{ if(s){ const im=new Image(); im.src="img/"+s; } }); }

function start(){
  setHeader(false);
  main.innerHTML = `
    <div class="card">
      <div class="hero"><img src="img/cover.jpg" alt="Akker met boerenkool op de Oale Esch"><div class="tag">10 vragen</div></div>
      <div class="intro">
        <h1>Biodiversiteits&shy;test</h1>
        <p><strong style="color:#000">Hoe goed ken jij de natuur op de Oale Esch?</strong></p>
        <p>Na elke vraag zie je meteen het antwoord, met uitleg.</p>
        <div class="themes">
          <div class="theme"><span><img src="img/icon-insecten.png" alt=""></span>Insecten</div>
          <div class="theme"><span><img src="img/icon-vogels.png" alt=""></span>Vogels</div>
          <div class="theme"><span><img src="img/icon-kever.png" alt=""></span>Bestuivers</div>
          <div class="theme"><span><img src="img/icon-bodem.png" alt=""></span>Bodemleven</div>
        </div>
        <button class="btn" id="go">Start de quiz</button>
      </div>
    </div>`;
  $("#go").onclick = () => { i=0; score=0; results=[]; preload(0); preload(1); show(); };
}

function show(){
  const q = Q[i];
  setHeader(true); updateHeader();
  main.innerHTML = `
    <div class="card">
      <img class="photo" src="img/${q.img}" alt="">
      <div class="qbody">
        <div class="qnum">Vraag ${i+1}</div>
        <h2>${q.q}</h2>
        <div class="opts">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="let">${L[k]}</span><span>${o}</span></button>`).join("")}</div>
        <div id="rev"></div>
      </div>
    </div>`;
  main.querySelectorAll(".opt").forEach(b => b.onclick = () => answer(+b.dataset.k, b));
  window.scrollTo({top:0, behavior:"instant"});
  preload(i+1);
}

function answer(k, btn){
  const q = Q[i], ok = q.good.includes(k);
  if(ok) score++;
  results.push(ok);
  main.querySelectorAll(".opt").forEach(b => {
    const kk = +b.dataset.k; b.disabled = true;
    if(q.good.includes(kk)) b.classList.add("goed");
    else if(kk === k) b.classList.add("fout");
    else b.classList.add("dim");
  });
  if(!ok){ btn.classList.add("shake"); if(navigator.vibrate) navigator.vibrate(60); }
  else if(q.good.length === 5) confetti();
  updateHeader();
  $("#bar").style.width = ((i+1) / Q.length * 100) + "%";

  const letters = q.good.map(g=>L[g]);
  const ansLine = q.good.length === 5 ? "Alle antwoorden zijn goed!"
                : q.good.length > 1 ? `Zowel ${letters.slice(0,-1).join(", ")} als ${letters.at(-1)} zijn goed`
                : `Het juiste antwoord is ${letters[0]}`;
  const praise = ["Goed zo!","Helemaal goed!","Knap!","Klopt!","Natuurkenner!"];
  const verdict = ok ? praise[i % praise.length] : "Helaas…";
  const last = i === Q.length - 1;
  $("#rev").innerHTML = `
    <div class="reveal">
      <div class="verdict ${ok?"ok":"nok"}">${verdict}</div>
      <div class="answer">${ansLine}</div>
      <div class="uitleg">${q.uitleg}</div>
      ${q.aimg ? `<img src="img/${q.aimg}" class="${q.acontain?"contain":""}" alt="">` : ""}
    </div>
    <button class="btn" id="next">${last ? "Bekijk je score" : "Volgende vraag →"}</button>`;
  $("#next").onclick = () => { if(last) end(); else { i++; show(); } };
  setTimeout(()=> $("#rev").scrollIntoView({behavior:"smooth", block:"start"}), 150);
}

function end(){
  setHeader(false);
  const lv = score >= 8 ? 0 : score >= 5 ? 1 : 2;
  const ranks = ["Natuurkenner","Goede basis","Nog veel te ontdekken"];
  const msg = ["Jij kent de Oale Esch op je duimpje!","Mooi! Je weet al aardig wat er op de boerderij leeft.","Er valt nog veel te ontdekken — en dat is juist leuk!"];
  main.innerHTML = `
    <div class="result card">
      <div class="qnum">Hoeveel had jij er goed?</div>
      <div class="big">${score}<small> / ${Q.length}</small></div>
      <div class="rank">${ranks[lv]}</div>
      <p>${msg[lv]}</p>
      <div class="recap">${results.map(r=>`<i class="${r?"g":""}"></i>`).join("")}</div>
      <div class="levels">
        <div class="lvl ${lv===0?"on":""}"><b>8 – 10</b>Natuurkenner</div>
        <div class="lvl ${lv===1?"on":""}"><b>5 – 7</b>Goede basis</div>
        <div class="lvl ${lv===2?"on":""}"><b>0 – 4</b>Nog veel te ontdekken</div>
      </div>
      <p style="margin-top:18px">Wil je meer ontdekken? Loop mee met de biodiversiteitswandeling of sluit je aan bij de werkgroep Biodiversiteit.</p>
      ${navigator.share ? `<button class="btn" id="share">Deel de quiz</button>` : ""}
      <button class="btn ghost" id="again">Nog een keer</button>
    </div>`;
  if(lv===0) confetti();
  $("#again").onclick = start;
  const sh = $("#share");
  if(sh) sh.onclick = () => navigator.share({title:"Biodiversiteitstest Oale Esch",
      text:`Ik had ${score} van de ${Q.length} goed bij de biodiversiteitstest van de Oale Esch. Hoeveel heb jij er goed?`,
      url:location.href}).catch(()=>{});
  window.scrollTo({top:0, behavior:"instant"});
}

function confetti(){
  const box = document.createElement("div"); box.className = "confetti";
  const cols = ["#650500","#95c23d","#ffffff","#650500"];
  for(let n=0;n<70;n++){
    const p=document.createElement("i");
    p.style.left=Math.random()*100+"vw"; p.style.background=cols[n%cols.length];
    p.style.animationDuration=(1.8+Math.random()*1.6)+"s"; p.style.animationDelay=(Math.random()*.4)+"s";
    box.appendChild(p);
  }
  document.body.appendChild(box); setTimeout(()=>box.remove(),4200);
}

start();
</script>
</body>
</html>
